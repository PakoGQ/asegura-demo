<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — Asegura</title>
  <meta name="theme-color" content="#ee7203" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <main class="offline-wrap">
    <span class="logo-marca" style="width:56px;height:56px;font-size:1.5rem"><i class="fas fa-shield-heart"></i></span>
    <h1>Te quedaste sin conexión</h1>
    <p>No podemos cargar el directorio en este momento. Revisa tu internet y
       vuelve a intentar; lo que estabas viendo sigue ahí.</p>
    <button class="btn btn-acento btn-lg" onclick="location.reload()">
      <i class="fas fa-rotate-right"></i> Reintentar
    </button>
    <p class="offline-nota">
      Si ya tenías una cita agendada, no se pierde: el agente la tiene registrada.
    </p>
  </main>
</body>
</html>
