<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cartera de Seguros — Acceso</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>

  <main class="contenedor">
    <div class="login-caja">
      <div class="marca">Cartera <span id="marca-aseguradora"></span></div>
      <p class="silencio">Gestión de cartera para equipos de agentes.</p>

      <div id="aviso" class="oculto"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn primario bloque" id="btn-entrar">Entrar</button>
      </form>

      <p class="silencio" style="margin-top:1rem">
        ¿Sin acceso? Tu director da de alta tu cuenta.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/constantes.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
  (async function () {
    UI.$('#marca-aseguradora').textContent = CONFIG.ASEGURADORA_DEFAULT;

    // Si ya hay sesión viva, no mostramos el login: directo a su pantalla.
    const { data } = await db.auth.getSession();
    if (data && data.session) {
      const usuario = await API.miUsuario();
      if (usuario && usuario.activo) {
        location.replace(Auth.rutaInicio(usuario.rol));
        return;
      }
    }

    UI.$('#form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = UI.$('#btn-entrar');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      UI.aviso('#aviso', '');

      try {
        const usuario = await Auth.entrar(
          UI.$('#email').value.trim(),
          UI.$('#password').value
        );
        location.replace(Auth.rutaInicio(usuario.rol));
      } catch (e) {
        UI.aviso('#aviso', e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  })();
  </script>
</body>
</html>
