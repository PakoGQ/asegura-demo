<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cartera consolidada</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
</head>
<body>
  <main class="contenedor">
    <h1>Cartera consolidada</h1>
    <div id="aviso" class="oculto"></div>

    <div class="filtros">
      <select id="f-agente"><option value="">Todos los agentes</option></select>
      <select id="f-ramo"></select>
      <select id="f-estatus"></select>
      <select id="f-dias">
        <option value="">Cualquier vencimiento</option>
        <option value="30">Vence en 30 días</option>
        <option value="60">Vence en 60 días</option>
        <option value="90">Vence en 90 días</option>
      </select>
    </div>

    <div id="metricas" class="metricas"></div>

    <section class="tarjeta">
      <header><h2>Pólizas</h2><span class="accion silencio" id="conteo"></span></header>
      <div id="lista"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/constantes.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/render.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  (async function () {
    const usuario = await App.iniciar({ rol: 'director', activo: 'cartera' });
    if (!usuario) return;

    UI.$('#f-ramo').innerHTML    = UI.opciones(CAT.RAMOS, true, 'Todos los ramos');
    UI.$('#f-estatus').innerHTML = UI.opciones(CAT.ESTATUS_POLIZA, true, 'Todos los estatus');

    // Permite llegar aquí desde Equipo con el agente ya preseleccionado.
    const agenteInicial = new URLSearchParams(location.search).get('agente') || '';

    try {
      const equipo = await API.miEquipo();
      UI.$('#f-agente').innerHTML = '<option value="">Todos los agentes</option>' +
        equipo.map((a) => `<option value="${UI.esc(a.id)}">${UI.esc(a.nombre)}</option>`).join('');
      UI.$('#f-agente').value = agenteInicial;
    } catch (e) {
      UI.error('#aviso', e);
    }

    async function cargar() {
      UI.pinta('#lista', UI.cargando());
      try {
        const filas = await API.polizas({
          agenteId: UI.$('#f-agente').value || undefined,
          ramo:     UI.$('#f-ramo').value || undefined,
          estatus:  UI.$('#f-estatus').value || undefined,
          diasMax:  UI.$('#f-dias').value || undefined,
        });

        UI.pinta('#metricas', Render.totalesCartera(filas));
        UI.$('#conteo').textContent = `${filas.length} resultado${filas.length === 1 ? '' : 's'}`;
        UI.pinta('#lista', Render.lista(
          filas,
          (p) => Render.poliza(p, { mostrarAgente: true }),
          'Ninguna póliza con esos filtros.'));
      } catch (e) {
        UI.error('#aviso', e);
        UI.pinta('#lista', UI.vacio('No se pudo cargar.'));
      }
    }

    UI.$$('.filtros select').forEach((s) => s.addEventListener('change', cargar));
    await cargar();
  })();
  </script>
</body>
</html>
