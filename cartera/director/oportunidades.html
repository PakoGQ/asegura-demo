<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oportunidades del equipo</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
</head>
<body>
  <main class="contenedor">
    <h1>Oportunidades</h1>
    <p class="silencio">Detectadas por reglas sobre la cartera. El agente decide qué hacer con cada una.</p>
    <div id="aviso" class="oculto"></div>

    <div class="filtros">
      <select id="f-agente"><option value="">Todos los agentes</option></select>
      <select id="f-tipo"></select>
      <select id="f-estatus"></select>
    </div>

    <div id="metricas" class="metricas"></div>

    <section class="tarjeta">
      <header><h2>Detectadas</h2><span class="accion silencio" id="conteo"></span></header>
      <div id="lista"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/constantes.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/render.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  (async function () {
    const usuario = await App.iniciar({ rol: 'director', activo: 'oportunidades' });
    if (!usuario) return;

    UI.$('#f-tipo').innerHTML    = UI.opciones(CAT.TIPOS_OPORTUNIDAD, true, 'Todos los tipos');
    UI.$('#f-estatus').innerHTML = UI.opciones(CAT.ESTATUS_OPORTUNIDAD, true, 'Todos los estatus');

    try {
      const equipo = await API.miEquipo();
      UI.$('#f-agente').innerHTML = '<option value="">Todos los agentes</option>' +
        equipo.map((a) => `<option value="${UI.esc(a.id)}">${UI.esc(a.nombre)}</option>`).join('');
    } catch (e) {
      UI.error('#aviso', e);
    }

    async function cargar() {
      UI.pinta('#lista', UI.cargando());
      try {
        const filas = await API.oportunidades({
          agenteId: UI.$('#f-agente').value || undefined,
          tipo:     UI.$('#f-tipo').value || undefined,
          estatus:  UI.$('#f-estatus').value || undefined,
        });

        const nuevas   = filas.filter((o) => o.estatus === 'nueva').length;
        const proceso  = filas.filter((o) => o.estatus === 'en_proceso').length;
        const ganadas  = filas.filter((o) => o.estatus === 'ganada').length;
        const enRiesgo = filas
          .filter((o) => o.tipo === 'riesgo_no_renovacion' && o.estatus === 'nueva')
          .reduce((s, o) => s + Number(o.valor_estimado || 0), 0);

        UI.pinta('#metricas', [
          UI.metrica('Sin atender', nuevas, '', nuevas ? 'alerta' : ''),
          UI.metrica('En proceso', proceso),
          UI.metrica('Ganadas', ganadas),
          UI.metrica('Prima en riesgo', UI.mxnCorto(enRiesgo), 'sin atender', enRiesgo ? 'riesgo' : ''),
        ].join(''));

        UI.$('#conteo').textContent = `${filas.length} oportunidad${filas.length === 1 ? '' : 'es'}`;
        // El Director observa; el cambio de estatus lo hace el agente dueño.
        UI.pinta('#lista', Render.lista(
          filas,
          (o) => Render.oportunidad(o, { mostrarAgente: true }),
          'Sin oportunidades con esos filtros.'));
      } catch (e) {
        UI.error('#aviso', e);
        UI.pinta('#lista', UI.vacio('No se pudo cargar.'));
      }
    }

    UI.$$('.filtros select').forEach((s) => s.addEventListener('change', cargar));
    await cargar();
  })();
  </script>
</body>
</html>
